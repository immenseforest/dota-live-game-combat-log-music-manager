<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dota DJ</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">LOCAL ADAPTIVE SOUNDTRACK</p>
        <h1>Dota DJ</h1>
        <p class="lede">Combat-aware music for streams, using tracks you are allowed to broadcast.</p>
      </div>
      <button id="audio-toggle" class="primary">Start audio</button>
    </header>

    <section class="now-playing">
      <div class="orb" id="orb"><span id="cue">COZY</span></div>
      <div class="meter-wrap">
        <div class="row"><span>Combat intensity</span><strong id="intensity">0</strong></div>
        <div class="meter"><div id="meter-fill"></div></div>
        <p id="status">Waiting for Dota telemetry…</p>
      </div>
    </section>

    <section class="grid">
      <article>
        <h2>Live event feed</h2>
        <ol id="feed"><li>No combat events yet.</li></ol>
      </article>
      <article>
        <h2>Test the transitions</h2>
        <p>Use these controls before opening Dota or while configuring OBS.</p>
        <div class="buttons">
          <button data-event="match_start">Match start</button>
          <button data-event="hero_kill">Hero kill</button>
          <button data-event="teamfight">Teamfight</button>
          <button data-event="roshan_kill">Roshan</button>
          <button data-event="match_end">Match end</button>
        </div>
      </article>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
